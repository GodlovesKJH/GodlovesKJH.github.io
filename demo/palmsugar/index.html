<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14261C">
<title>팜슈가 농원(1호점)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14261C; --ink-2:#3C4A41; --muted:#7C8A80;
  --leaf:#1F6B47; --leaf-dk:#144F34; --leaf-sf:#E8F1EA;
  --mango:#EFA02C; --mango-sf:#FDF2DD;
  --clay:#C25A3C; --clay-sf:#FBEBE6;
  --paper:#FBF8F1; --card:#FFFFFF; --line:#E4DFD2;
  --r:14px; --pad:16px;
  --shadow:0 1px 2px rgba(20,38,28,.05), 0 6px 20px rgba(20,38,28,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.62; letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;
}
/* 크메르어: 세로 공간이 더 필요하고 단어 사이 공백이 없다 */
body.lang-km{ font-family:'Noto Sans Khmer','Noto Sans KR',sans-serif; font-size:16px; line-height:1.95; letter-spacing:0 }
body.lang-km .btn,body.lang-km .chip,body.lang-km .badge{ line-height:1.6; height:auto; min-height:48px }
body.lang-km h1,body.lang-km h2,body.lang-km h3{ line-height:1.7 }
.km-safe{ word-break:normal; overflow-wrap:break-word }
body.lang-en{ letter-spacing:0 }

#app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative}
.wrap{padding:0 var(--pad) 120px}
h1,h2,h3{margin:0; font-weight:700}
.display{font-family:'Gowun Batang','Noto Sans KR',serif; letter-spacing:-.02em}
body.lang-km .display{font-family:'Noto Sans Khmer',serif}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit}
input,select,textarea{
  width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:11px;
  background:var(--card); outline:none; -webkit-appearance:none; appearance:none;
}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%237C8A80' stroke-width='2' fill='none' stroke-linecap='round'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--leaf); box-shadow:0 0 0 3px var(--leaf-sf)}
textarea{min-height:88px; resize:vertical; line-height:1.6}
label.f{display:block; margin:14px 0 6px; font-size:13px; font-weight:500; color:var(--ink-2)}
label.f .req{color:var(--clay); margin-left:3px}
.hint{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5}

/* ---------- 헤더 ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--leaf-dk); color:#fff;
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.top .back{
  background:rgba(255,255,255,.14); border:0; color:#fff; width:36px; height:36px;
  border-radius:10px; font-size:19px; cursor:pointer; display:none; flex:0 0 auto;
}
.top .ttl{flex:1; font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.langs{display:flex; gap:3px; background:rgba(255,255,255,.13); border-radius:9px; padding:3px; flex:0 0 auto}
.langs button{
  background:none; border:0; color:rgba(255,255,255,.72); font-size:11.5px; font-weight:700;
  padding:5px 8px; border-radius:6px; cursor:pointer; white-space:nowrap;
}
.langs button.on{background:#fff; color:var(--leaf-dk)}

/* ---------- 히어로 ---------- */
.hero{position:relative; min-height:250px; display:flex; flex-direction:column; justify-content:flex-end;
  padding:26px 20px 22px; background:var(--leaf-dk); overflow:hidden}
.hero .slide{position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity 1.6s ease, transform 8s linear; transform:scale(1)}
.hero .slide.on{opacity:1; transform:scale(1.07)}
.hero .veil{position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,38,28,.15) 0%,rgba(20,38,28,.55) 55%,rgba(20,38,28,.85) 100%)}
.hero .in{position:relative; z-index:2; color:#fff}
.hero h1{font-size:27px; line-height:1.28; text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hero .sub{margin-top:7px; font-size:13.5px; color:rgba(255,255,255,.86); text-shadow:0 1px 8px rgba(0,0,0,.3)}
.hero .eyebrow{font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--mango); margin-bottom:9px}

/* ---------- 카드/버튼 ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-top:12px; box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.sec{margin-top:26px}
.sec-h{display:flex; align-items:baseline; gap:8px; margin-bottom:11px}
.sec-h h2{font-size:17px}
.sec-h .n{font-size:12px; color:var(--muted); font-weight:500}

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:52px; padding:14px 16px; border:0; border-radius:12px;
  background:var(--leaf); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  transition:transform .06s ease, background .15s ease;
}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#C4CDC7; cursor:default}
.btn.alt{background:var(--card); color:var(--ink); border:1.5px solid var(--line); box-shadow:var(--shadow)}
.btn.mango{background:var(--mango); color:#3A2A08}
.btn.danger{background:var(--clay-sf); color:var(--clay); border:1.5px solid #EFCFC4}
.btn.sm{min-height:40px; padding:8px 13px; font-size:13.5px; border-radius:10px; width:auto}
.btn.ghost{background:none; border:1.5px solid var(--line); color:var(--ink-2)}
.btn:focus-visible{outline:3px solid var(--mango); outline-offset:2px}
.row{display:flex; gap:8px}
.row>*{flex:1}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  padding:3px 8px; border-radius:99px; background:var(--leaf-sf); color:var(--leaf-dk); white-space:nowrap}
.badge.mango{background:var(--mango-sf); color:#8A5B08}
.badge.clay{background:var(--clay-sf); color:var(--clay)}
.badge.gray{background:#EEF0EC; color:var(--muted)}

/* ---------- 상품 ---------- */
.prod{display:flex; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod .th{width:62px; height:62px; border-radius:11px; background:var(--leaf-sf) center/cover; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:23px}
.prod .nm{font-weight:700; font-size:15px}
.prod .pr{color:var(--leaf); font-weight:700; margin-top:2px}
.prod .st{font-size:12px; color:var(--muted)}
.prod.soon{opacity:.62}
.prod.dim{opacity:.45}
.riel{font-size:11.5px; color:var(--muted); font-weight:400}

/* ---------- 수량 스테퍼 ---------- */
.step{display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:11px; overflow:hidden; background:var(--card)}
.step button{width:46px; height:46px; border:0; background:none; font-size:21px; font-weight:700; color:var(--leaf); cursor:pointer}
.step button:active{background:var(--leaf-sf)}
.step button:disabled{color:#C4CDC7}
.step .v{min-width:52px; text-align:center; font-weight:700; font-size:16px}

/* ---------- 장바구니 ---------- */
.ci{border:1px solid var(--line); border-radius:12px; padding:13px; margin-top:10px; background:var(--card)}
.ci.editing{border-color:var(--mango); border-width:2px; box-shadow:0 0 0 3px var(--mango-sf)}
.ci .top-r{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.ci .meta{font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.6}
.sum{border-top:2px solid var(--ink); margin-top:16px; padding-top:12px}
.sum .l{display:flex; justify-content:space-between; padding:4px 0; font-size:14px; color:var(--ink-2)}
.sum .l.tot{font-size:19px; font-weight:700; color:var(--ink); padding-top:9px; margin-top:6px; border-top:1px dashed var(--line)}

/* ---------- 하단 고정바 ---------- */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:35; background:rgba(251,248,241,.96);
  backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:11px var(--pad);
  padding-bottom:calc(11px + env(safe-area-inset-bottom))}
.dock .in{max-width:520px; margin:0 auto}

/* ---------- 소식 ---------- */
.news{background:var(--mango-sf); border:1px solid #F2DFB6; border-radius:var(--r); padding:13px 15px; margin-top:14px}
.news .hd{display:flex; align-items:center; gap:7px; font-weight:700; font-size:14px; color:#7A4F06}
.news li{list-style:none; padding:7px 0; border-top:1px dashed #EBD5A8; font-size:14px; cursor:pointer;
  display:flex; align-items:center; gap:6px}
.news ul{margin:6px 0 0; padding:0}
.news .body{padding:9px 0 3px; font-size:14px; color:#5C4310; white-space:pre-wrap; line-height:1.7}
.news img{width:100%; border-radius:10px; margin-top:9px}

/* ---------- 메시지 스레드 ---------- */
.thread{margin-top:10px; display:flex; flex-direction:column; gap:8px}
.msg{max-width:82%; padding:10px 13px; border-radius:14px; font-size:14px; white-space:pre-wrap; line-height:1.6}
.msg.buyer{align-self:flex-end; background:var(--leaf); color:#fff; border-bottom-right-radius:4px}
.msg.farm{align-self:flex-start; background:#EEF0EC; color:var(--ink); border-bottom-left-radius:4px}
.msg .t{display:block; font-size:10.5px; opacity:.7; margin-top:4px}

/* ---------- 탭 ---------- */
.tabs{display:flex; gap:5px; overflow-x:auto; padding:11px 0 3px; -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto; padding:9px 14px; border-radius:99px; border:1.5px solid var(--line);
  background:var(--card); font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap}
.tabs button.on{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700}
.subtabs button.on{background:var(--leaf); border-color:var(--leaf)}

/* 탭이 화면보다 길 때 좌우로 넘겨보는 화살표.
   PC에서는 터치 스와이프가 없어 뒤쪽 탭(⑥ 가게 설정)이 잘려 보이지 않던 문제를 해결한다. */
.tabsWrap{position:relative}
.tabsWrap .tabNav{
  position:absolute; top:50%; transform:translateY(-50%); z-index:5;
  width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font-size:17px; line-height:1; cursor:pointer;
  display:none; align-items:center; justify-content:center; padding:0;
  box-shadow:0 2px 8px rgba(20,38,28,.16);
}
.tabsWrap .tabNav.show{display:flex}
.tabsWrap .tabNav:active{background:var(--leaf-sf)}
.tabsWrap .tabNav.prev{left:-4px}
.tabsWrap .tabNav.next{right:-4px}
/* 화살표 뒤로 탭이 비쳐 잘린 느낌을 주도록 가장자리 페이드 */
.tabsWrap .tabFade{position:absolute; top:0; bottom:0; width:46px; pointer-events:none; z-index:4; display:none}
.tabsWrap .tabFade.show{display:block}
.tabsWrap .tabFade.left{left:0; background:linear-gradient(90deg,var(--paper) 30%,rgba(251,248,241,0))}
.tabsWrap .tabFade.right{right:0; background:linear-gradient(270deg,var(--paper) 30%,rgba(251,248,241,0))}

/* ---------- 상태 ---------- */
.state{text-align:center; padding:44px 20px; color:var(--muted); font-size:14px}
.state .em{font-size:32px; display:block; margin-bottom:11px; opacity:.5}
.spin{width:22px; height:22px; border:2.5px solid var(--line); border-top-color:var(--leaf);
  border-radius:50%; animation:sp .7s linear infinite; margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.qr{width:100%; max-width:300px; margin:0 auto; display:block; border-radius:12px; border:1px solid var(--line); background:#fff}

/* ---------- 모달 ---------- */
.modal{position:fixed; inset:0; z-index:60; background:rgba(20,38,28,.5); display:flex;
  align-items:flex-end; justify-content:center; padding:0}
.modal .box{background:var(--paper); width:100%; max-width:520px; border-radius:20px 20px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:up .22s ease}
@keyframes up{from{transform:translateY(30px); opacity:.5}to{transform:none; opacity:1}}
.modal h3{font-size:18px; margin-bottom:10px}

.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:70;
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:99px; font-size:13.5px;
  font-weight:500; box-shadow:0 8px 26px rgba(0,0,0,.22); max-width:88%; text-align:center}
.toast.bad{background:var(--clay)}

/* ---------- 최초 사용 안내(온보딩) ----------
   같이 설명해줄 사람 없이 현지인이 혼자 처음 써도 흐름을 알 수 있게.
   최초 1회, 언어 무관하게 표시됨. */
.ob-mask{position:fixed; inset:0; z-index:80; background:rgba(20,38,28,.94);
  display:flex; align-items:center; justify-content:center; padding:24px}
.ob-card{background:#fff; border-radius:20px; padding:30px 24px 24px; max-width:360px; width:100%; text-align:center}
.ob-ic{font-size:46px; margin-bottom:14px}
.ob-t{font-size:19px; font-weight:800; margin-bottom:9px}
.ob-d{font-size:14.5px; color:var(--ink-2); line-height:1.7; margin-bottom:22px}
.ob-dots{display:flex; justify-content:center; gap:6px; margin-bottom:20px}
.ob-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--line); transition:.2s}
.ob-dots .dot.on{background:var(--leaf); width:20px; border-radius:4px}
body.lang-km .ob-t{line-height:1.7}
body.lang-km .ob-d{font-size:15.5px; line-height:1.95}

.divider{height:1px; background:var(--line); margin:15px 0}
.mini{font-size:12.5px; color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
a{color:var(--leaf); text-decoration:none; font-weight:500}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important}
  .hero .slide.on{transform:none}
}
</style>
</head>

  order: null,                       // 방금 완료한 주문
  lookup: { name:'', phone:'', orders:[], open:null, editing:null },
  admin: { pin: sessionStorage.getItem('pin') || '', on:false, tab:'orders', sub:'delivery',
           orders:[], news:[], products:[], availability:[] },

const $  = s => document.querySelector(s);
const T  = k => (I18N[S.lang] && I18N[S.lang][k]) || I18N.ko[k] || k;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n   = v => { const x = parseInt(String(v==null?'':v).replace(/[^0-9-]/g,''),10); return isNaN(x)?0:x; };

/** 센트 정수 → "$12.50" (부동소수 오차 방지를 위해 계산은 항상 센트로) */
const money = c => '$' + (n(c)/100).toFixed(2);
const riel  = c => {
  if (String(S.settings.showRiel||'Y') !== 'Y') return '';
  const r = n(S.settings.exchangeRate) || 4100;
  return '≈ ' + Math.round(n(c)/100*r).toLocaleString() + '៛';
};
const dollarsToCents = v => Math.round(parseFloat(String(v).replace(/[^0-9.]/g,'')||0) * 100);
const centsToDollars = c => (n(c)/100).toFixed(2);

const pname = p => S.lang==='km' ? (p.nameKm||p.name) : S.lang==='en' ? (p.nameEn||p.name) : p.name;
const punit = p => (S.lang==='km' ? (p.unitKm||p.unit) : S.lang==='en' ? (p.unitEn||p.unit) : p.unit) || T('unitEa');
const mlabel = m => m==='delivery'?T('mDelivery'):m==='pickup'?T('mPickup'):m==='church'?T('mChurch'):m;

const WD_KO = ['일','월','화','수','목','금','토'];
function fmtDate(iso){
  if(!iso) return '';
  const p = String(iso).split('-'); if(p.length<3) return iso;
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  if(isNaN(d)) return iso;
  if(S.lang==='ko') return `${p[0]}.${+p[1]}.${+p[2]}(${WD_KO[d.getDay()]})`;
  return `${String(+p[2]).padStart(2,'0')}/${String(+p[1]).padStart(2,'0')}/${p[0]}`;
}
function todayISO(){
  const d = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Phnom_Penh'}));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isOnSale(p){
  if(String(p.active)!=='Y') return false;
  const s = String(p.saleStartDate||'').trim();
  return !s || s <= todayISO();
}
function isSoon(p){
  if(String(p.active)!=='Y') return false;
  const s = String(p.saleStartDate||'').trim();
  return !!s && s > todayISO();
}
function schedText(it){
  if(it.method==='delivery') return fmtDate(it.deliveryDate) || '—';
  if(it.method==='pickup')   return (fmtDate(it.visitDate)+' '+(it.visitTime||'')).trim();
  if(it.method==='church')   return (fmtDate(it.handDate)+' · '+(it.handPlace||'')).trim();
  return '';
}
function addrText(it){
  return [it.addrHouse&&('#'+it.addrHouse), it.addrStreet&&('St. '+it.addrStreet),
          it.addrSangkat, it.addrKhan].filter(Boolean).join(', ');
}
function itemsTotal(cart){ return cart.reduce((s,i)=>s+n(i.amountCents),0); }
function deliveryFee(cart){
  if(!cart.some(i=>i.method==='delivery')) return 0;
  const th = n(S.settings.freeDeliveryThresholdCents);
  if(th>0 && itemsTotal(cart)>=th) return 0;
  return n(S.settings.deliveryFeeCents);
}
function grandTotal(cart){ return itemsTotal(cart)+deliveryFee(cart); }

async function api(action, payload={}, ms=20000){ return MOCK_API(action, payload); }

let toastTimer = null;
function toast(msg, bad){
  clearTimeout(toastTimer);
  $('#toast').innerHTML = `<div class="toast ${bad?'bad':''} km-safe">${esc(msg)}</div>`;
  toastTimer = setTimeout(()=>{ $('#toast').innerHTML=''; }, 2600);
}
function modal(html){
  $('#modal').innerHTML = `<div class="modal"><div class="box">${html}</div></div>`;
  $('#modal .modal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });
}
function closeModal(){ $('#modal').innerHTML=''; }
window.closeModal = closeModal;

function go(view){
  S.view = view;
  closeModal();
  window.scrollTo(0,0);
  render();
}
window.go = go;


/* ═══════════ ⑦ 렌더 진입점 ═══════════ */
function render(){
  document.body.className = 'lang-'+S.lang;
  document.documentElement.lang = S.lang;
  const back = $('#backBtn');
  back.style.display = (S.view==='landing') ? 'none' : 'block';
  $('#topTitle').textContent = S.settings.businessName || '팜슈가 농원(1호점)';

  const v = $('#view'); const d = $('#dock');
  d.innerHTML = '';

  if(!S.loaded && !S.failed){ v.innerHTML = stateLoading(); return; }
  if(S.failed && !S.loaded){ v.innerHTML = stateFail(); return; }

  switch(S.view){
    case 'landing': v.innerHTML = viewLanding(); startHero(); break;
    case 'shop':    v.innerHTML = viewShop(); break;
    case 'cart':    v.innerHTML = viewCart(); dockCart(); break;
    case 'done':    v.innerHTML = viewDone(); break;
    case 'lookup':  v.innerHTML = viewLookup(); break;
    case 'admin':   v.innerHTML = viewAdmin(); initTabScroll(); break;
  }
}
function stateLoading(){
  return `<div class="state"><div class="spin"></div>${esc(T('loading'))}</div>`;
}
function stateFail(){
  return `<div class="state"><span class="em">📡</span>
    <div style="font-weight:700;color:var(--ink);font-size:15px">${esc(T('failTitle'))}</div>
    <div style="margin:8px 0 18px" class="km-safe">${esc(T('failBody'))}</div>
    <button class="btn" style="max-width:220px;margin:0 auto" onclick="loadPublic(true)">${esc(T('retry'))}</button></div>`;
}

let heroTimer = null;
function heroPhotos(){
  return [S.settings.landingPhoto1, S.settings.landingPhoto2, S.settings.landingPhoto3].filter(x=>x&&x.length>50);
}
function startHero(){
  clearInterval(heroTimer);
  const ph = heroPhotos(); if(ph.length<2) return;
  heroTimer = setInterval(()=>{
    const slides = document.querySelectorAll('.hero .slide');
    if(!slides.length){ clearInterval(heroTimer); return; }
    slides[S.heroIdx % slides.length].classList.remove('on');
    S.heroIdx = (S.heroIdx+1) % slides.length;
    slides[S.heroIdx].classList.add('on');
  }, 7000);
}

        <div style="font-weight:700">${esc(S.settings.businessName||'')}</div>

    </div>
  </div>`;
}

function prodRow(p, soon){

      deliveryDate:'', visitDate:'', visitTime:'', handPlace:'', handDate:'',
      gift:'', giftName:'', giftPhone:'' };
    S.editIdx = -1;

  go('shop');
}

function draftQty(delta){
  const p = S.products.find(x=>x.id===S.draft.productId);
  const max = p? n(p.stock) : 99;
  let q = n(S.draft.qty)+delta;
  if(q<1) q=1; if(q>max) q=max;
  S.draft.qty = q;
  S.draft.amountCents = q * n(S.draft.unitPriceCents);
  render();
}

async function doLookup(){

    const r = await api('lookup', { name:L.name.trim(), phone:L.phone.trim() });

function parseItems(o){ try{ return JSON.parse(o.itemsJson||'[]'); }catch(e){ return []; } }
function parseMsgs(o){ try{ return JSON.parse(o.messagesJson||'[]'); }catch(e){ return []; } }
function orderTotal(o){
  const it = parseItems(o);
  let sum = it.reduce((s,x)=>s+n(x.amountCents),0);
  if(it.some(x=>x.method==='delivery')){
    const th = n(S.settings.freeDeliveryThresholdCents);
    if(!(th>0 && sum>=th)) sum += n(S.settings.deliveryFeeCents);
  }
  return sum;
}

  const items = parseItems(o);

/* ---------- 관리자 탭 좌우 넘기기 ----------
   PC에는 터치 스와이프가 없어 화면 밖으로 밀려난 탭(⑥ 가게 설정)을 누를 방법이 없었다.
   넘칠 때만 좌우 화살표를 띄우고, 스크롤 위치에 따라 자동으로 숨긴다. */
function updateTabNav(){
  const box = $('#adminTabs'); if(!box) return;
  const prev = $('#tabPrev'), next = $('#tabNext');
  const fadeL = $('#tabFadeL'), fadeR = $('#tabFadeR');
  const overflow = box.scrollWidth - box.clientWidth;
  if(overflow <= 4){                              // 넘치지 않으면 전부 숨김
    [prev,next,fadeL,fadeR].forEach(el=>el&&el.classList.remove('show'));
    return;
  }
  const atStart = box.scrollLeft <= 2;
  const atEnd   = box.scrollLeft >= overflow - 2;
  prev  && prev.classList.toggle('show', !atStart);
  fadeL && fadeL.classList.toggle('show', !atStart);
  next  && next.classList.toggle('show', !atEnd);
  fadeR && fadeR.classList.toggle('show', !atEnd);
}
function scrollTabs(dir){
  const box = $('#adminTabs'); if(!box) return;
  box.scrollBy({ left: dir * Math.max(140, box.clientWidth * 0.6), behavior:'smooth' });
  setTimeout(updateTabNav, 320);
}
window.scrollTabs = scrollTabs;

function initTabScroll(){
  const box = $('#adminTabs'); if(!box) return;
  box.addEventListener('scroll', updateTabNav, {passive:true});
  // 선택된 탭이 화면 밖이면 보이도록 끌어온다
  const on = box.querySelector('button.on');
  if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
  updateTabNav();
  setTimeout(updateTabNav, 60);   // 웹폰트 로딩 후 폭이 바뀌는 경우 대비
}
window.addEventListener('resize', updateTabNav);

/* ---------- 이미지 압축 ---------- */
function compress(file, maxW, quality){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

    <label class="f" style="margin-top:0">${esc(T('aExchangeLabel'))}</label>
    <input inputmode="numeric" value="${esc(st.exchangeRate||'4100')}" oninput="setS('exchangeRate',this.value)">
    <label style="display:flex;align-items:center;gap:9px;margin-top:11px;cursor:pointer">
      <input type="checkbox" style="width:21px;height:21px;accent-color:var(--leaf)" ${String(st.showRiel||'Y')==='Y'?'checked':''}
        onchange="setS('showRiel',this.checked?'Y':'')"> <span>${esc(T('aShowRielLabel'))}</span></label>
    <div class="row" style="margin-top:11px">
      <div><label class="f" style="margin-top:0">${esc(T('aDeliveryFeeLabel'))}</label>
        <input inputmode="decimal" value="${centsToDollars(st.deliveryFeeCents||150)}" oninput="setS('deliveryFeeCents',dollarsToCents(this.value))"></div>
      <div><label class="f" style="margin-top:0">${esc(T('aFreeThresholdLabel'))}</label>
        <input inputmode="decimal" value="${centsToDollars(st.freeDeliveryThresholdCents||2000)}" oninput="setS('freeDeliveryThresholdCents',dollarsToCents(this.value))"></div>
    </div>
    <div class="hint">${esc(T('aFeeHint'))}</div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:4px">${esc(T('aSettingsPay'))}</div>
    <div class="mini" style="margin-bottom:10px">${esc(T('aPayHint'))}</div>
    ${a.khqrImage&&a.khqrImage.length>50?`<img class="qr" src="${a.khqrImage}" style="max-width:200px;margin-bottom:9px">`:''}
    <input type="file" accept="image/*" onchange="pickQR(this)" style="padding:9px">
    <div class="row" style="margin-top:11px">
      <div><label class="f" style="margin-top:0">${esc(T('bank'))}</label>
        <input value="${esc(a.bank||'')}" oninput="setA('bank',this.value)" placeholder="ABA Bank"></div>
      <div><label class="f" style="margin-top:0">${esc(T('holder'))}</label>
        <input value="${esc(a.holder||'')}" oninput="setA('holder',this.value)"></div>
    </div>
    <label class="f">${esc(T('aAcctLabel'))}</label>
    <input value="${esc(a.number||'')}" oninput="setA('number',this.value)">
    <button class="btn sm" style="width:100%;margin-top:12px" onclick="saveAcct()">${esc(T('aSavePay'))}</button>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">${esc(T('aSettingsNotify'))}</div>
    <label class="f" style="margin-top:0">${esc(T('aNotifyEmailLabel'))}</label>
    <input type="email" inputmode="email" value="${esc(st.notifyEmail||'')}" oninput="setS('notifyEmail',this.value)">
    <div class="hint">${esc(T('aNotifyEmailHint'))}</div>
    <label class="f">${esc(T('aTgTokenLabel'))}</label>
    <input value="${esc(st.telegramToken||'')}" oninput="setS('telegramToken',this.value)" placeholder="123456:ABC-DEF…">
    <label class="f">${esc(T('aTgChatIdLabel'))}</label>
    <input value="${esc(st.telegramChatId||'')}" oninput="setS('telegramChatId',this.value)">
    <div class="hint">${T('aTgHint')}</div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">${esc(T('aSettingsSms'))}</div>
    <label class="f" style="margin-top:0">${esc(T('aSmsDefaultLabel'))}</label>
    <textarea oninput="setS('smsTemplate',this.value)" placeholder="${esc(T('aSmsDefaultPh'))}">${esc(st.smsTemplate||'')}</textarea>
    <label class="f">${esc(T('aSmsDelayLabel'))}</label>
    <textarea oninput="setS('smsTemplateDelay',this.value)" placeholder="${esc(T('aSmsDelayPh'))}">${esc(st.smsTemplateDelay||'')}</textarea>
    <label class="f">${esc(T('aSmsWhichLabel'))}</label>
    <select onchange="setS('smsDefault',this.value)">
      <option value="basic" ${st.smsDefault!=='delay'?'selected':''}>${esc(T('aSmsBasicOpt'))}</option>
      <option value="delay" ${st.smsDefault==='delay'?'selected':''}>${esc(T('aSmsDelayOpt'))}</option>
    </select>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">${esc(T('aSettingsPin'))}</div>
    <input inputmode="numeric" value="${esc(st.adminPin||'')}" oninput="setS('adminPin',this.value)">
    <div class="hint">${esc(T('aPinHint'))}</div>
  </div>

  <button class="btn" style="margin-top:16px" onclick="saveSettings()">${esc(T('aSaveSettingsBtn'))}</button>`;
}
function setS(k,v){ S.settings[k]=v; }
function setA(k,v){ S.account[k]=v; }
window.setS=setS; window.setA=setA;

async function pickHero(el,i){
  if(!el.files||!el.files[0]) return;
  toast(T('aCompressing'));
  try{
    S.settings['landingPhoto'+i] = await compress(el.files[0], 500, 0.7);
    await api('saveSettings',{pin:S.admin.pin,settings:{['landingPhoto'+i]:S.settings['landingPhoto'+i]}},30000);
    render(); toast(T('aPhotoUploaded'));
  }catch(e){ toast(T('aPhotoSaveFail'),true); }
}
window.pickHero = pickHero;
async function clearHero(i){
  S.settings['landingPhoto'+i]='';
  try{ await api('saveSettings',{pin:S.admin.pin,settings:{['landingPhoto'+i]:''}}); render(); }
  catch(e){ toast(e.message,true); }
}
window.clearHero = clearHero;
async function pickQR(el){
  if(!el.files||!el.files[0]) return;
  toast(T('aQrProcessing'));
  try{
    // QR은 인식률이 중요하므로 압축을 약하게 (700px / 품질 0.92)
    S.account.khqrImage = await compress(el.files[0], 700, 0.92);
    render(); toast(T('aQrUploadedHint'));
  }catch(e){ toast(T('aPhotoFail'),true); }
}
window.pickQR = pickQR;
async function saveAcct(){
  try{ await api('saveAccount',{pin:S.admin.pin,account:S.account},30000); toast(T('aAcctSaved')); }
  catch(e){ toast(e.message,true); }
}
window.saveAcct = saveAcct;
async function saveSettings(){
  try{
    await api('saveSettings',{pin:S.admin.pin,settings:S.settings},30000);
    toast(T('aSettingsSaved'));
  }catch(e){ toast(e.message,true); }
}
window.saveSettings = saveSettings;


/* ═══════════ ⑭ 데이터 로드 · 부트스트랩 ═══════════ */

/** 공개 데이터 불러오기. 화면을 먼저 그려두고 채우므로 백지 화면이 생기지 않는다. */
async function loadPublic(retry){
  if(retry){ S.failed = false; S.loaded = false; render(); }
  const firstLoad = !S.loaded;
  try{
    const r = await api('public', {}, 20000);
    S.products     = r.products     || [];
    S.settings     = r.settings     || {};
    S.account      = r.account      || {};
    S.availability = r.availability || [];
    S.news         = r.news         || [];
    S.loaded = true; S.failed = false;
  }catch(e){
    S.failed = true;
    if(!S.loaded) console.warn('공개 데이터 로드 실패:', e.message);
  }
  render();
  if(firstLoad && S.loaded && needOnboard()) showOnboard();
}
window.loadPublic = loadPublic;

/* ---------- 최초 사용 안내(온보딩) ----------
   옆에서 설명해줄 사람 없이도 처음 온 사람이 흐름을 알 수 있게.
   기기당 최초 1회만 표시, 현재 선택된 언어로 보여준다. */
const OB_KEY = 'onboarded_v1';
let obStep = 0;
function needOnboard(){ return !localStorage.getItem(OB_KEY); }
function showOnboard(){ obStep = 0; renderOnboard(); }
function renderOnboard(){
  const steps = [
    { ic:'🧺', t:T('ob1t'), d:T('ob1d') },
    { ic:'🛵', t:T('ob2t'), d:T('ob2d') },
    { ic:'💳', t:T('ob3t'), d:T('ob3d') }
  ];
  const s = steps[obStep];
  const last = obStep === steps.length - 1;
  $('#onboard').innerHTML = `<div class="ob-mask">
    <div class="ob-card">
      <div class="ob-ic">${s.ic}</div>
      <div class="ob-t km-safe">${esc(s.t)}</div>
      <div class="ob-d km-safe">${esc(s.d)}</div>
      <div class="ob-dots">${steps.map((_,i)=>`<span class="dot ${i===obStep?'on':''}"></span>`).join('')}</div>
      <button class="btn" onclick="${last?'obFinish()':'obNext()'}">${esc(last?T('obStart'):T('obNext'))}</button>
      ${!last?`<button class="btn sm ghost" style="margin-top:8px" onclick="obFinish()">${esc(T('obSkip'))}</button>`:''}
    </div>
  </div>`;
}
function obNext(){ obStep++; renderOnboard(); }
function obFinish(){ localStorage.setItem(OB_KEY,'1'); $('#onboard').innerHTML=''; }
window.obNext = obNext; window.obFinish = obFinish; window.showOnboard = showOnboard;

/** 조용한 갱신 — 화면을 다시 그리되 사용자가 입력 중이면 건너뛴다 */
async function refreshQuiet(){
  if(document.hidden) return;
  if(S.view === 'cart' || S.view === 'done') return;   // 작성/결제 중에는 건드리지 않음
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  if($('#modal').innerHTML.trim()) return;             // 모달 열려 있으면 건너뜀

  try{
    if(S.view === 'admin' && S.admin.on){
      await loadAdmin();
    }else{
      const r = await api('public', {}, 20000);
      S.products     = r.products     || [];
      S.settings     = r.settings     || {};
      S.account      = r.account      || {};
      S.availability = r.availability || [];
      S.news         = r.news         || [];
      S.loaded = true; S.failed = false;
    }
    render();
  }catch(e){ /* 갱신 실패는 조용히 넘긴다. 다음 주기에 다시 시도 */ }
}

/* ── 뒤로 가기 ── */
const BACK = { shop:'landing', cart:'shop', done:'landing', lookup:'landing', admin:'landing' };
function goBack(){
  if(S.view === 'cart' && S.editIdx >= 0){ S.editIdx = -1; S.draft = null; render(); return; }
  if(S.view === 'lookup' && S.lookup.editing){ S.lookup.editing = null; render(); return; }
  if(S.view === 'lookup' && S.lookup.open){ S.lookup.open = null; render(); return; }
  go(BACK[S.view] || 'landing');
}
window.goBack = goBack;

/* ── 언어 전환 ── */
function setLang(code){
  S.lang = code;
  localStorage.setItem('lang', code);
  document.querySelectorAll('.langs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.lang === code);
  });
  render();
  if($('#onboard').innerHTML.trim()) renderOnboard();   // 온보딩 표시 중 언어 전환 시 즉시 반영
}
window.setLang = setLang;

/* ── 시작 ── */
(function boot(){
  document.querySelectorAll('.langs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.lang === S.lang);
    b.addEventListener('click', ()=> setLang(b.dataset.lang));
  });
  $('#backBtn').addEventListener('click', goBack);

  // 안드로이드 물리 뒤로가기 버튼을 앱 안에서 처리
  history.replaceState({v:'landing'}, '');
  window.addEventListener('popstate', ()=>{
    if(S.view !== 'landing'){ history.pushState({v:S.view}, ''); goBack(); }
  });

  render();          // 먼저 그린다 (로딩 표시)
  loadPublic();      // 그 다음 채운다

  setInterval(refreshQuiet, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshQuiet(); });
})();

</script>
</body>
</html>
