<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a5c2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arrow English 학습앱 v6.6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f0;min-height:100vh;color:#222;-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
/* 입력창은 텍스트 선택·편집 허용 */
input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;-webkit-touch-callout:default}
.screen{display:none;padding:16px;max-width:600px;margin:0 auto}
.screen.active{display:block}
.card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:16px;text-align:center}
.card-flat{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px}
h1{font-size:32px;color:#1a5c2e;margin-bottom:10px;line-height:1.3}
h2{font-size:28px;color:#1a5c2e;margin-bottom:12px}
h3{font-size:22px;color:#2d7a45;margin-bottom:8px}
.emoji-big{font-size:64px;margin:16px 0}
.subtitle{font-size:20px;color:#666;margin-bottom:16px}
input[type=text]{width:100%;font-size:24px;padding:16px;border-radius:12px;border:2px solid #ddd;margin:8px 0}
input:focus{outline:none;border-color:#2d7a45}
.btn{display:block;width:100%;font-size:24px;padding:18px;background:#1a5c2e;color:#fff;border:none;border-radius:14px;cursor:pointer;font-weight:700;margin:8px 0;transition:background .2s}
.btn:hover{background:#2d7a45}
.btn:active{transform:scale(.98)}
.btn-sec{background:#7f8c8d}
.btn-sec:hover{background:#95a5a6}
.btn-sm{font-size:20px;padding:14px}
.btn-quiz{background:#e67e22;font-size:22px;padding:16px}
.btn-quiz:hover{background:#f39c12}
.btn-back{background:none;color:#1a5c2e;font-size:20px;padding:10px;text-align:left;width:auto;font-weight:600}

/* Menu buttons */
.menu-btn{display:flex;align-items:center;background:#fff;border:none;width:100%;padding:18px 16px;border-radius:16px;margin:8px 0;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:left;transition:transform .15s}
.menu-btn:active{transform:scale(.98)}
.menu-btn .m-emoji{font-size:36px;margin-right:14px;flex-shrink:0}
.menu-btn .m-text{flex:1}
.menu-btn .m-title{font-size:22px;font-weight:700;color:#222}
.menu-btn .m-sub{font-size:16px;color:#888;margin-top:2px}
.menu-btn .m-check{font-size:24px;color:#27ae60;margin-left:8px}
.menu-btn.locked{opacity:.5}
.menu-btn.locked .m-title{color:#999}

/* Stage badge */
.stage-badge{display:inline-block;background:#1a5c2e;color:#fff;font-size:14px;padding:4px 10px;border-radius:20px;margin-bottom:8px}

/* Learning cards */
.learn-card{background:#fff;border-radius:16px;padding:24px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center}
.learn-word{font-size:48px;font-weight:800;color:#1a5c2e;letter-spacing:2px}
.learn-meaning{font-size:28px;font-weight:700;color:#e67e22;margin:6px 0}
.learn-pron{font-size:22px;color:#e74c3c}
.learn-emoji{font-size:48px;margin:8px 0}
.learn-kr{font-size:24px;color:#555;margin:6px 0}

/* Arrow sentence */
.arrow-box{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0}
.arrow-word{display:inline-flex;flex-direction:column;align-items:center;background:#e8f5e9;padding:8px 12px;border-radius:10px;cursor:pointer;transition:background .2s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.arrow-word:active{background:#c8e6c9}
.arrow-en{font-size:28px;font-weight:700;color:#1a5c2e}
.arrow-kr{font-size:18px;color:#666;margin-top:2px}
.arrow-sep{font-size:28px;color:#aaa;align-self:center}

/* Nav bar */
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav-count{font-size:20px;color:#666;font-weight:600}
.nav-arrows{display:flex;gap:8px}
.nav-arrows button{font-size:28px;padding:8px 16px;border-radius:10px;border:none;background:#e8f5e9;color:#1a5c2e;cursor:pointer;font-weight:700}
.nav-arrows button:disabled{opacity:.3}

/* Quiz */
.quiz-opt{display:block;width:100%;font-size:22px;padding:16px;margin:8px 0;background:#f8f9fa;border:3px solid #e0e0e0;border-radius:14px;cursor:pointer;text-align:left;font-weight:600;transition:all .2s}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.correct{background:#d5f5e3;border-color:#27ae60;color:#1a5c2e}
.quiz-opt.wrong{background:#fadbd8;border-color:#e74c3c;color:#c0392b}
.quiz-progress{font-size:18px;color:#666;margin:8px 0}
.quiz-q{font-size:26px;font-weight:700;color:#333;margin:12px 0}
.quiz-emoji{font-size:52px;margin:8px 0}
.quiz-feedback{font-size:28px;font-weight:700;margin:16px 0;padding:16px;border-radius:14px}
.quiz-feedback.ok{background:#d5f5e3;color:#1a5c2e}
.quiz-feedback.fail{background:#fadbd8;color:#c0392b}

/* Celebration overlay */
.celeb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:9999;flex-direction:column}
.celeb-overlay.show{display:flex}
.celeb-box{background:#fff;border-radius:24px;padding:40px;text-align:center;max-width:360px;margin:20px;animation:celebPop .5s ease}
.celeb-emoji{font-size:80px;margin-bottom:16px}
.celeb-title{font-size:32px;font-weight:800;color:#1a5c2e;margin-bottom:8px}
.celeb-sub{font-size:20px;color:#666;margin-bottom:20px}
@keyframes celebPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:24px;top:-30px;z-index:10000;animation:confettiFall 3s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* Speech btn */
.speech-btn{display:inline-block;font-size:20px;padding:10px 18px;background:#3498db;color:#fff;border:none;border-radius:10px;cursor:pointer;margin:6px}
.speech-btn:hover{background:#2980b9}


/* Progress bar */
.prog-bar{width:100%;height:8px;background:#e0e0e0;border-radius:4px;margin:8px 0;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);border-radius:4px;transition:width .3s}

/* Writing canvas */
.canvas-wrap{position:relative;margin:12px auto;border:3px solid #1a5c2e;border-radius:12px;background:#fff;touch-action:none}
.canvas-wrap canvas{display:block;border-radius:9px}

/* QA pair */
.qa-box{background:#f8f9fa;border-radius:14px;padding:16px;margin:10px 0}
.qa-q{font-size:22px;font-weight:700;color:#2c3e50;margin-bottom:6px}
.qa-a{font-size:22px;color:#1a5c2e;font-weight:600}
.qa-kr{font-size:18px;color:#888;margin-top:4px}

/* Preposition highlight */
.prep-hl{color:#e67e22;font-weight:800;text-decoration:underline}

/* ── 생활영어카드 ── */
.life-cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.life-cat-tabs::-webkit-scrollbar{display:none}
.life-cat-tab{background:#fff;border:2px solid #ddd;border-radius:24px;padding:10px 16px;font-size:16px;font-weight:600;color:#888;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
.life-cat-tab.on{background:#1a5c2e;border-color:#1a5c2e;color:#fff}
.lc-search{display:flex;align-items:center;background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);gap:8px}
.lc-search input{flex:1;border:none;outline:none;font-size:18px;background:transparent;font-family:inherit;color:#222}
.lci-count{font-size:15px;color:#888;margin-bottom:12px}
.life-card-item{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;cursor:pointer}
.lci-front{padding:16px 18px;display:flex;align-items:center;gap:12px}
.lci-en{font-size:22px;font-weight:900;color:#1a5c2e;flex:1}
.lci-pron{font-size:15px;color:#888;flex-shrink:0}
.lci-arr{color:#bbb;font-size:18px;transition:transform .2s;flex-shrink:0}
.life-card-item.open .lci-arr{transform:rotate(180deg)}
.lci-back{display:none;padding:0 18px 16px;border-top:1px solid #f0f4f0}
.life-card-item.open .lci-back{display:block}
.lci-meaning{font-size:20px;font-weight:700;color:#222;padding-top:12px;margin-bottom:6px}
.lci-desc{font-size:16px;color:#666;line-height:1.65}
.lci-no-result{text-align:center;padding:40px;color:#aaa;font-size:18px}
.menu-btn-life{background:linear-gradient(135deg,#1a5c2e 0%,#2d6a4f 100%)}
.menu-btn-life .m-title{color:#fff}
.menu-btn-life .m-sub{color:rgba(255,255,255,.82)}
.menu-btn-life .life-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.menu-btn-life .life-pill{font-size:12px;background:rgba(255,255,255,.22);color:#fff;padding:2px 9px;border-radius:12px}


/* ── 4-1단계: 성경 이야기 ── */
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.story-card{background:#fff;border-radius:16px;padding:14px 12px;box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer;text-align:center;transition:transform .15s;border:2px solid transparent;position:relative}
.story-card:active{transform:scale(.97)}
.story-card.done{border-color:#27ae60}
.story-card .sc-icon{font-size:32px;margin-bottom:4px}
.story-card .sc-num{font-size:12px;color:#aaa;margin-bottom:2px}
.story-card .sc-title{font-size:15px;font-weight:700;color:#1a5c2e;line-height:1.3}
.story-card .sc-sub{font-size:12px;color:#999;margin-top:2px}
.story-card .sc-done{position:absolute;top:8px;right:8px;font-size:16px}
.story-sent-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px}
.story-sent-num{font-size:14px;color:#aaa;margin-bottom:6px;text-align:right}
.story-sent-arrow{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:10px 0}
.story-sent-word{display:inline-flex;flex-direction:column;align-items:center;background:#e8f5e9;padding:7px 10px;border-radius:9px;cursor:pointer;transition:background .15s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.story-sent-word:active{background:#c8e6c9}
.ssw-en{font-size:22px;font-weight:700;color:#1a5c2e}
.story-sent-word.prep-word .ssw-en{color:#e67e22;font-weight:900;text-decoration:underline}
.story-sent-sep{font-size:22px;color:#bbb;align-self:center}
.story-sent-kr{font-size:20px;color:#555;margin-top:10px;text-align:center;line-height:1.5}
.story-sent-meaning-btn{display:block;margin:14px auto 0;background:#fff;color:#1a5c2e;border:2px solid #1a5c2e;border-radius:10px;padding:9px 20px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.story-sent-meaning-btn:active{background:#e8f5e9}
.story-sent-meaning-btn.shown{background:#1a5c2e;color:#fff}
.story-sent-listen{display:block;margin:10px auto 0;background:#3498db;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit}
.story-sent-listen:active{background:#2980b9}
.story-title-bar{background:linear-gradient(135deg,#1a5c2e,#2d7a45);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;text-align:center}
.stb-num{font-size:14px;opacity:.8;margin-bottom:2px}
.stb-title{font-size:22px;font-weight:900}
.stb-sub{font-size:14px;opacity:.8;margin-top:2px}


/* ── 단어 뜻 팝업 ── */
.word-pop-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:99999}
.word-pop-overlay.show{display:flex}
.word-pop{background:#fff;border-radius:20px;width:90%;max-width:480px;padding:28px 22px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.word-pop-en{font-size:42px;font-weight:900;color:#1a5c2e;line-height:1.2}
.word-pop-en.prep{color:#e67e22;text-decoration:underline}
.word-pop-pron{font-size:22px;color:#e74c3c;margin-top:6px}
.word-pop-mean{font-size:26px;font-weight:700;color:#333;margin-top:14px;padding:14px;background:#f4f8f4;border-radius:14px}
.word-pop-prep-tag{display:inline-block;margin-top:12px;background:#fff3cd;color:#856404;font-size:16px;font-weight:700;padding:6px 14px;border-radius:20px}
.word-pop-listen{display:block;width:100%;margin-top:18px;background:#3498db;color:#fff;border:none;border-radius:14px;padding:16px;font-size:22px;font-weight:700;cursor:pointer;font-family:inherit}
.word-pop-listen:active{background:#2980b9}
.word-pop-close{display:block;width:100%;margin-top:10px;background:#fff;color:#888;border:2px solid #e0e0e0;border-radius:14px;padding:14px;font-size:18px;font-weight:600;cursor:pointer;font-family:inherit}

/* Responsive */
@media(max-width:400px){
.learn-word{font-size:38px}
.arrow-en{font-size:24px}
h1{font-size:28px}
h2{font-size:24px}
.btn{font-size:22px;padding:16px}
}
</style>
</head>
<body>
<script>window.DEMO_BANNER={resetPrefixes:["ae_"],hint:"이름은 아무거나 넣어도 됩니다 · 소리 듣기는 휴대폰·PC 음성으로"};</script>
<script src="../_shared/banner.js"></script>


<!-- Login Screen -->
<div id="scrLogin" class="screen active">
<div class="card" style="margin-top:40px">
<div class="emoji-big">✝️📖</div>
<h1>Arrow English<br>학습앱</h1>
<p class="subtitle">크리스챤을 위한<br>7단계 영어 학습</p>
<input type="text" id="inpName" placeholder="이름을 입력하세요">
<input type="text" id="inpTitle" placeholder="직분 (예: 장로, 집사, 권사, 성도)">
<button class="btn" onclick="app.login()">✨ 학습 시작</button>
</div>
<p style="text-align:center;font-size:12px;color:#aaa;margin-top:20px">Arrow English v6.6 · Made by Claude</p>
</div>

<!-- Home Screen -->
<div id="scrHome" class="screen">
<div class="card">
<div id="welcomeMsg" style="font-size:24px;font-weight:700;color:#1a5c2e"></div>
<div class="prog-bar"><div id="homeProg" class="prog-fill" style="width:0%"></div></div>
<div id="homeProgText" class="subtitle"></div>
</div>
<div id="menuList"></div>
<button class="btn btn-sec btn-sm" onclick="app.logout()" style="margin-top:16px">🚪 로그아웃</button>
</div>

<!-- Learning Screen -->
<div id="scrLearn" class="screen">
<div class="nav-bar">
<button class="btn-back" id="learnBackBtn" onclick="app.goBackFromLearn()">← 홈</button>
<span id="learnCount" class="nav-count"></span>
</div>
<div id="learnTitle" style="text-align:center"></div>
<div id="learnContent"></div>
<div class="nav-bar" style="margin-top:12px">
<div class="nav-arrows" style="width:100%;justify-content:space-between">
<button id="btnPrev" onclick="app.prevItem()">◀ 이전</button>
<button id="btnNext" onclick="app.nextItem()">다음 ▶</button>
</div>
</div>
<div style="text-align:center;margin-top:8px">
<button class="btn btn-quiz" onclick="app.startQuiz()">📝 퀴즈 도전!</button>
</div>
</div>

<!-- Preposition Guide Screen -->
<div id="scrPrepGuide" class="screen">
<div class="nav-bar">
<button class="btn-back" onclick="app.goHome()">← 홈</button>
<span class="nav-count">전치사 안내</span>
</div>
<div class="card">
<span class="stage-badge">🔗 3단계: 핵심 전치사 10개</span>
<h2 style="margin-top:10px">전치사란?</h2>
<p style="font-size:20px;color:#555;line-height:1.6">영어에서 <b>방향</b>과 <b>위치</b>를 알려주는<br>아주 중요한 단어입니다!</p>
</div>
<div id="prepGuideList"></div>
<button class="btn" onclick="app.openPrepSentences()" style="margin-top:12px">📖 전치사 문장 학습하기 ▶</button>
<button class="btn btn-quiz" onclick="app.curStage=3;app.startQuiz()" style="margin-top:8px">📝 퀴즈 도전!</button>
</div>

<!-- Quiz Screen -->
<div id="scrQuiz" class="screen">
<div class="nav-bar">
<button class="btn-back" onclick="app.endQuiz()">← 그만하기</button>
<span id="quizCount" class="nav-count"></span>
</div>
<div id="quizContent" class="card"></div>
</div>

<!-- Celebration Overlay -->
<div id="celebOverlay" class="celeb-overlay">
<div class="celeb-box">
<div class="celeb-emoji" id="celebEmoji">🎉</div>
<div class="celeb-title" id="celebTitle"></div>
<div class="celeb-sub" id="celebSub"></div>
<button class="btn" onclick="app.closeCeleb()">👍 확인</button>
</div>
</div>


<!-- Story List Screen -->
<div id="scrStoryList" class="screen">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
  <button class="btn-back" onclick="app.goHome()">← 홈</button>
  <span style="font-size:21px;font-weight:800;flex:1;color:#1a5c2e">📖 성경 이야기 30편</span>
  <span id="storyDoneChip" style="font-size:14px;background:#1a5c2e;color:#fff;padding:4px 12px;border-radius:20px;font-weight:700">0/30</span>
</div>
<div class="story-grid" id="storyGrid"></div>
<div style="height:20px"></div>
</div>

<!-- Story Read Screen -->
<div id="scrStoryRead" class="screen">
<div class="nav-bar">
  <button class="btn-back" onclick="app.backToStoryList()">← 목록</button>
  <span id="storyReadProg" class="nav-count"></span>
</div>
<div class="story-title-bar" id="storyTitleBar"></div>
<div id="storyReadContent"></div>
<div class="nav-bar" style="margin-top:8px">
  <div class="nav-arrows" style="width:100%;justify-content:space-between">
    <button id="btnSSPrev" onclick="app.prevStorySent()">◀ 이전</button>
    <button id="btnSSNext" onclick="app.nextStorySent()">다음 ▶</button>
  </div>
</div>
<div id="storyQuizBtnWrap" style="display:none;margin-top:10px">
  <button class="btn btn-quiz" onclick="app.startStoryQuiz()">📝 이 이야기 퀴즈 5개!</button>
</div>
<div style="height:16px"></div>
</div>

<!-- Word Meaning Popup -->
<div id="wordPopOverlay" class="word-pop-overlay" onclick="app.closeWordPop(event)">
<div class="word-pop" id="wordPopBox" onclick="event.stopPropagation()">
  <div class="word-pop-en" id="wordPopEn"></div>
  <div class="word-pop-pron" id="wordPopPron"></div>
  <div class="word-pop-mean" id="wordPopMean"></div>
  <div id="wordPopPrepTag"></div>
  <button class="word-pop-listen" onclick="app.speak(app._curWord)">🔊 발음 다시 듣기</button>
  <button class="word-pop-close" onclick="app.closeWordPop()">닫기</button>
</div>
</div>

<!-- Life Cards Screen -->
<div id="scrLife" class="screen">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
  <button class="btn-back" onclick="app.goHome()">← 홈</button>
  <span style="font-size:22px;font-weight:800;flex:1;color:#1a5c2e">🏷️ 생활영어 카드</span>
  <span id="lifeTotalChip" style="font-size:14px;background:#1a5c2e;color:#fff;padding:4px 12px;border-radius:20px;font-weight:700">250</span>
</div>
<div class="life-cat-tabs" id="lifeCatTabs"></div>
<button class="btn btn-quiz" onclick="app.startLifeQuiz()" style="font-size:18px;padding:13px;margin-bottom:12px">📝 이 카테고리 퀴즈 도전!</button>
<div class="lc-search">
  <span style="font-size:20px;color:#aaa">🔍</span>
  <input type="text" id="lifeSearch" placeholder="영어 또는 한글로 검색…" oninput="app.filterLife()" autocomplete="off">
</div>
<div class="lci-count" id="lifeCount"></div>
<div id="lifeList"></div>
<div style="height:60px"></div>
</div>

<script>
// ===== LIFE CARDS DATA =====

user: null,
progress: {},

init() {
    // popstate는 항상 등록 (로그인 여부 무관)
    window.addEventListener('popstate', (e) => {
        if (e.state && e.state.scr) this.showScreen(e.state.scr, true);
    });
    let saved = null;
    try { saved = localStorage.getItem('ae_user'); } catch(e) {}
    if (saved) {
        try { this.user = JSON.parse(saved); } catch(e) { this.user = null; }
        if (this.user) { this.loadProgress(); this.showHome(); return; }
    }
},

showScreen(id, noPush) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (!noPush) history.pushState({scr:id}, '', '');
    window.scrollTo(0,0);
},

// ── Auth ──
login() {
    const name = document.getElementById('inpName').value.trim();
    const title = document.getElementById('inpTitle').value.trim();
    if (!name || !title) { alert('이름과 직분을 모두 입력해주세요!'); return; }
    this.user = {name, title};
    try { localStorage.setItem('ae_user', JSON.stringify(this.user)); } catch(e) {}
    this.loadProgress();
    this.showHome();
},

logout() {
    this.user = null;
    try { localStorage.removeItem('ae_user'); } catch(e) {}
    this.showScreen('scrLogin');
},

loadProgress() {
    let s = null;
    try { s = localStorage.getItem('ae_prog_' + this.user.name); } catch(e) {}
    try { this.progress = s ? JSON.parse(s) : {}; } catch(e) { this.progress = {}; }
},

saveProgress() {
    try { localStorage.setItem('ae_prog_' + this.user.name, JSON.stringify(this.progress)); } catch(e) {}
},

    const completed = Object.keys(this.progress).filter(k => this.progress[k]).length;
    document.getElementById('welcomeMsg').innerHTML =

    document.getElementById('homeProg').style.width = Math.round(completed/STAGES.length*100) + '%';

    const ml = document.getElementById('menuList');

        const done = !!this.progress['s' + st.id];
        const btn = document.createElement('button');
        btn.className = 'menu-btn';

goHome() { this.showHome(); },

goBackFromLearn() {

// ── TTS ──
speak(text, rate) {
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate || 0.7;   // 기본 0.7 (단어용)
        speechSynthesis.speak(u);
    }
},

// 문장 전체 듣기: 더 느리게 (0.55)
speakSentence(text) {
    this.speak(text, 0.55);
},

// 단어/버튼 탭 핸들러: touchstart+click 중복 방지
_lastTap: 0,
tapSpeak(text) {
    const now = Date.now();
    if (now - this._lastTap < 350) return;  // 350ms 내 중복 호출 무시
    this._lastTap = now;
    this.speak(text);
},

// 문장 전체 듣기 (느린 속도) + 중복 방지
tapSentence(text) {
    const now = Date.now();
    if (now - this._lastTap < 350) return;
    this._lastTap = now;
    this.speakSentence(text);
},

// ── 단어 뜻 팝업 ──
_curWord: '',
showWord(rawWord, isPrep) {
    const now = Date.now();
    if (now - this._lastTap < 350) return;
    this._lastTap = now;

    const clean = rawWord.replace(/[.,!?]/g,'').toLowerCase();
    const entry = WORD_DICT[clean];
    this._curWord = clean;

    document.getElementById('wordPopEn').textContent = rawWord.replace(/[.,!?]/g,'');
    document.getElementById('wordPopEn').className = 'word-pop-en' + (isPrep ? ' prep' : '');

    if (entry) {
        document.getElementById('wordPopPron').textContent = '[' + entry[1] + ']';
        document.getElementById('wordPopMean').textContent = entry[0];
    } else {
        document.getElementById('wordPopPron').textContent = '';
        document.getElementById('wordPopMean').textContent = '(뜻 정보 없음)';
    }

    const tag = document.getElementById('wordPopPrepTag');
    tag.innerHTML = isPrep
        ? '<span class="word-pop-prep-tag">🔗 전치사 — 방향·위치를 알려주는 단어</span>'
        : '';

    document.getElementById('wordPopOverlay').classList.add('show');
    this.speak(clean);
},

closeWordPop(e) {
    if (e && e.target && e.target.id !== 'wordPopOverlay') return;
    document.getElementById('wordPopOverlay').classList.remove('show');
},

// ── Stage Open ──
openStage(id) {
    this.curStage = id;
    this.curIdx = 0;
    this.prepFilter = null;
    if (id === 3) {
        this.renderPrepGuide();
        this.showScreen('scrPrepGuide');
        return;
    }
    if (id === 41) {
        this.openStoryList();
        return;
    }
    this.renderLearn();
    this.showScreen('scrLearn');
},

                <div style="flex:1">
                    <div style="font-size:28px;font-weight:800;color:${p.color}">${p.prep}</div>
                    <div style="font-size:20px;color:#555">${p.meaning}</div>
                </div>
                <span style="font-size:18px;color:#888;background:#f0f0f0;padding:4px 12px;border-radius:12px">${count}문장 ▶</span>
            </div>
            <div style="font-size:22px;text-align:center;padding:8px;background:#f8f9fa;border-radius:10px;margin:8px 0">${p.visual}</div>
            <div style="font-size:18px;color:#888">예: ${p.examples.join(', ')}</div>
        `;
        list.appendChild(card);
    });
},

openPrepSentences() {
    this.curStage = 3;
    this.curIdx = 0;
    this.prepFilter = null;
    this.renderLearn();
    this.showScreen('scrLearn');
},

openPrepFiltered(prep) {
    this.curStage = 3;
    this.prepFilter = prep;
    this.curIdx = 0;
    this.renderLearn();
    this.showScreen('scrLearn');
},

getStageData() {
    const key = this.curStage === 21 ? 's21' : 's' + this.curStage;
    const data = DATA[key];
    if (this.curStage === 3 && this.prepFilter) {
        return data.filter(it => it.prep === this.prepFilter);
    }
    return data;
},

renderLearn() {
    const data = this.getStageData();
    const item = data[this.curIdx];
    const st = STAGES.find(s => s.id === this.curStage);

    document.getElementById('learnCount').textContent =
        `${this.curIdx + 1} / ${data.length}`;
    document.getElementById('learnTitle').innerHTML =
        `<span class="stage-badge">${st.icon} ${st.title}</span>`;

    // Show preposition group label for stage 3
    if (this.curStage === 3 && item.prep) {
        const pg = PREP_GUIDE.find(p => p.prep === item.prep);
        if (pg) {
            document.getElementById('learnTitle').innerHTML +=
                `<div style="margin-top:8px"><span style="display:inline-block;background:${pg.color};color:#fff;font-size:20px;font-weight:700;padding:6px 16px;border-radius:20px">${pg.icon} ${pg.prep} — ${pg.meaning}</span></div>`;
        }
    }

    // Update back button label
    document.getElementById('learnBackBtn').textContent =
        this.curStage === 3 ? '← 전치사 안내' : '← 홈';

    const c = document.getElementById('learnContent');

    if (this.curStage === 1) {
        // Alphabet
        c.innerHTML = `
        <div class="learn-card">
            <div class="learn-word" style="font-size:64px">${item.l}</div>
            <div class="learn-emoji">${item.e}</div>
            <div class="learn-word">${item.w}</div>
            <div class="learn-meaning">(${item.m})</div>
            <div class="learn-pron">[${item.p}]</div>
            <div style="margin-top:12px">
                <button class="speech-btn" onclick="app.speak('${item.w}')">🔊 듣기</button>
            </div>
        </div>`;
    } else if (this.curStage === 21) {
        // be동사 stage
        const en = item.en;
        const words = en.split(' ');
        let sentHtml = words.map(w => {
            const isBeVerb = ['am','is','are'].includes(w.toLowerCase());
            const safeW = w.replace(/'/g,"\\'");
            return `<span class="arrow-word" ontouchend="app.tapSpeak('${safeW}')" onclick="app.tapSpeak('${safeW}')">
                <span class="arrow-en" style="${isBeVerb ? 'color:#e74c3c;font-weight:900;text-decoration:underline' : ''}">${w}</span>
            </span>`;
        }).join('<span class="arrow-sep">→</span>');

        c.innerHTML = `
        <div class="learn-card">
            <div class="learn-emoji">${item.e}</div>
            <div style="margin-bottom:8px">
                <span class="stage-badge" style="background:${item.catColor}">${item.cat}</span>
            </div>
            <div class="arrow-box">${sentHtml}</div>
            <div class="learn-kr" style="margin-top:12px;font-size:24px;color:#555">${item.kr}</div>
            <div style="margin-top:16px;padding:12px;background:#fff3cd;border-radius:12px;font-size:20px;color:#856404">
                💡 <b>${item.be}</b> = 주어가 "존재한다"는 뜻
            </div>
            <div style="margin-top:12px">
                <button class="speech-btn" onclick="app.speakSentence('${en.replace(/'/g,"\\'").replace(/\(It\)/g,'').trim()}')">🔊 듣기</button>
            </div>
        </div>`;
    } else if (this.curStage === 7) {
        // QA pairs
        c.innerHTML = `
        <div class="learn-card">
            <div class="learn-emoji">${item.e}</div>
            <div class="qa-box">
                <div class="qa-q">Q: ${item.q}</div>
                <div class="qa-kr" style="margin-bottom:8px">${item.qk}</div>
                <div class="qa-a">A: ${item.a}</div>
                <div class="qa-kr">${item.ak}</div>
            </div>
            <div style="margin-top:12px">
                <button class="speech-btn" onclick="app.speakSentence('${item.q.replace(/'/g,"\\'")}')">🔊 질문 듣기</button>
                <button class="speech-btn" onclick="app.speakSentence('${item.a.replace(/'/g,"\\'")}')">🔊 답변 듣기</button>
            </div>
        </div>`;
    } else {
        // Sentence stages (2-6)
        const en = item.en;
        const prepWord = item.prep || '';

        let sentHtml = en.split(' ').map(w => {
            const isPrep = prepWord && w.toLowerCase() === prepWord.toLowerCase();
            const safeW = w.replace(/'/g,"\\'");
            return `<span class="arrow-word" ontouchend="app.tapSpeak('${safeW}')" onclick="app.tapSpeak('${safeW}')">
                <span class="arrow-en${isPrep ? ' prep-hl' : ''}">${w}</span>
            </span>`;
        }).join('<span class="arrow-sep">→</span>');

        let extraInfo = '';
        if (this.curStage === 5 && item.verb) {
            extraInfo = `<div style="margin:8px 0;font-size:20px;color:#888">${item.verb} + ${item.prep}</div>`;
        }
        if (item.cat) {
            extraInfo = `<div style="margin:8px 0"><span class="stage-badge" style="background:#e67e22">${item.cat}</span></div>`;
        }

        c.innerHTML = `
        <div class="learn-card">
            <div class="learn-emoji">${item.e}</div>
            ${extraInfo}
            <div class="arrow-box">${sentHtml}</div>
            <div class="learn-kr" style="margin-top:12px;font-size:26px">${item.kr}</div>
            <div style="margin-top:12px">
                <button class="speech-btn" onclick="app.speakSentence('${en.replace(/'/g,"\\'")}')">🔊 듣기</button>
            </div>
        </div>`;
    }

    document.getElementById('btnPrev').disabled = this.curIdx === 0;
    document.getElementById('btnNext').disabled = this.curIdx === data.length - 1;
},

prevItem() { if (this.curIdx > 0) { this.curIdx--; this.renderLearn(); } },
nextItem() {
    const data = this.getStageData();
    if (this.curIdx < data.length - 1) { this.curIdx++; this.renderLearn(); }
},

// ── Quiz ──
startQuiz() {
    const qKey = this.curStage === 21 ? 'q21' : 'q' + this.curStage;
    const raw = QUIZZES[qKey];
    if (!raw || raw.length === 0) return;

    // Shuffle quiz questions
    this.quizList = [...raw].sort(() => Math.random() - 0.5).slice(0, 30);
    this.quizIdx = 0;
    this.quizScore = 0;
    this.wrongSet = [];
    this.quizAnswered = false;
    this.renderQuiz();
    this.showScreen('scrQuiz');
},

renderQuiz() {
    const total = this.quizList.length;
    const q = this.quizList[this.quizIdx];
    document.getElementById('quizCount').textContent =
        `문제 ${this.quizIdx + 1} / ${total}`;

    // Shuffle options but track correct answer
    const opts = q.o.map((text, i) => ({text, isCorrect: i === q.a}));
    for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
    }

    const c = document.getElementById('quizContent');
    c.innerHTML = `
        <div class="quiz-emoji">${q.e}</div>
        <div class="quiz-q" style="white-space:pre-line">${q.q}</div>
        <div id="quizOpts">
            ${opts.map((o, i) =>
                `<button class="quiz-opt" id="qo${i}" data-correct="${o.isCorrect}">${o.text}</button>`
            ).join('')}
        </div>
        <div id="quizFB" style="display:none"></div>
        <div id="quizNextDiv" style="display:none;margin-top:12px">
            <button class="btn" id="quizNextBtn">다음 문제 ▶</button>
        </div>
    `;

    this.quizAnswered = false;
    opts.forEach((o, i) => {
        document.getElementById('qo'+i).onclick = () => this.answerQuiz(i, o.isCorrect);
    });
},

answerQuiz(idx, isCorrect) {
    if (this.quizAnswered) return;
    this.quizAnswered = true;

    // Highlight all buttons
    const btns = document.querySelectorAll('.quiz-opt');
    btns.forEach(b => {
        if (b.dataset.correct === 'true') b.classList.add('correct');
    });

    const fb = document.getElementById('quizFB');
    fb.style.display = 'block';

    if (isCorrect) {
        this.quizScore++;
        btns[idx].classList.add('correct');
        fb.className = 'quiz-feedback ok';
        const okMsgs = ['✅ 정답이에요! 잘하셨습니다!','🎉 맞아요! 훌륭하세요!','👍 완벽해요! 대단하십니다!','🌟 정확해요! 역시 잘하시네요!'];
        fb.textContent = okMsgs[Math.floor(Math.random()*okMsgs.length)];
    } else {
        btns[idx].classList.add('wrong');
        fb.className = 'quiz-feedback fail';
        const failMsgs = [
            '💪 조금만 더! 초록색 정답을 확인하세요!',
            '🌱 괜찮아요! 틀려야 더 잘 기억돼요!',
            '😊 아깝네요! 정답을 보고 기억해 두세요!',
            '🙌 천천히 가도 괜찮아요! 초록색이 정답이에요!'
        ];
        fb.textContent = failMsgs[Math.floor(Math.random()*failMsgs.length)];
        this.wrongSet.push(this.quizList[this.quizIdx]);
    }

    const nd = document.getElementById('quizNextDiv');
    nd.style.display = 'block';
    document.getElementById('quizNextBtn').onclick = () => this.nextQuiz();
},

nextQuiz() {
    this.quizIdx++;
    if (this.quizIdx < this.quizList.length) {
        this.renderQuiz();
    } else if (!this.isLifeQuiz && this.wrongSet.length > 0) {
        // 커리큘럼 퀴즈만 오답 재시도
        this.quizList = [...this.wrongSet].sort(() => Math.random() - 0.5);
        this.wrongSet = [];
        this.quizIdx = 0;
        const c = document.getElementById('quizContent');
        c.innerHTML = `
            <div style="text-align:center;padding:30px">
                <div style="font-size:52px">🔄</div>
                <h2 style="margin:16px 0">오답 재도전!</h2>
                <p class="subtitle">틀린 ${this.quizList.length}문제를 다시 풀어볼까요?</p>
                <button class="btn" onclick="app.renderQuiz()">도전하기!</button>
            </div>`;
    } else {
        this.quizComplete();
    }
},

quizComplete() {
    const c = document.getElementById('quizContent');

    // ── 성경이야기 / 생활영어 퀴즈 결과 ──
    if (this.isLifeQuiz) {
        // Save story progress if 5-question quiz
        if (this.quizList.length === 5 && !this.progress['story'+this.curStoryIdx]) {
            this.progress['story'+this.curStoryIdx] = true;
            this.saveProgress();
        }
        // Story quiz completion
        const isStory = BIBLE_STORIES[this.curStoryIdx] && this.quizList.length === 5;
        const total = this.lifeQuizTotal;
        const score = this.quizScore;
        const pct = Math.round(score / total * 100);
        const catLabel = LIFE_CATS.find(ct => ct.id === this.lifeCat)?.label || '생활영어';
        const emoji = pct >= 80 ? '🎊' : pct >= 60 ? '👍' : '💪';
        const msg   = pct >= 80 ? '훌륭하세요! 대단하십니다!'
                    : pct >= 60 ? '잘하셨어요! 조금만 더!'
                    : '괜찮아요! 카드 복습 후 다시 도전!';
        c.innerHTML = `
            <div style="text-align:center;padding:30px">
                <div style="font-size:64px">${emoji}</div>
                <div style="font-size:15px;color:#888;margin:8px 0">${catLabel}</div>
                <h2 style="margin:8px 0">퀴즈 완료!</h2>
                <div style="font-size:52px;font-weight:900;color:#1a5c2e;margin:12px 0">${pct}<span style="font-size:28px">점</span></div>
                <p style="font-size:20px;color:#666;margin-bottom:8px">${total}문제 중 <b>${score}개</b> 정답</p>
                <p style="font-size:18px;color:#888;margin-bottom:24px">${msg}</p>
                <button class="btn btn-quiz" onclick="app.startLifeQuiz()" style="margin-bottom:8px">🔄 다시 풀기</button>
                <button class="btn btn-sec" onclick="app.isLifeQuiz=false;app.showScreen('scrLife')">← 카드로 돌아가기</button>
            </div>`;
        return;
    }

    // ── 커리큘럼 퀴즈 결과 ──
    const stKey = this.curStage === 21 ? 's21' : 's' + this.curStage;
    const wasNew = !this.progress[stKey];
    this.progress[stKey] = true;
    this.saveProgress();

    c.innerHTML = `
        <div style="text-align:center;padding:30px">
            <div style="font-size:64px">🎊</div>
            <h2 style="margin:16px 0">퀴즈 완료!</h2>
            <p style="font-size:22px;color:#666">모든 문제를 맞히셨습니다!</p>
            <button class="btn" onclick="app.goHome()" style="margin-top:16px">홈으로 돌아가기</button>
        </div>`;

    if (wasNew) {
        setTimeout(() => this.showCelebration(), 500);
    }
},

// ── Celebration ──
showCelebration() {
    const st = STAGES.find(s => s.id === this.curStage);
    document.getElementById('celebEmoji').textContent = '🎉🏆🎊';
    document.getElementById('celebTitle').textContent = `${st.title} 통과!`;
    document.getElementById('celebSub').textContent =
        `축하합니다! ${this.user.name} ${this.user.title}님이\n${st.title}를 완료하셨습니다!`;
    document.getElementById('celebOverlay').classList.add('show');
    this.launchConfetti();
},

closeCeleb() {
    document.getElementById('celebOverlay').classList.remove('show');
    document.querySelectorAll('.confetti-piece').forEach(c => c.remove());
},

launchConfetti() {
    const colors = ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#ff6b81'];
    for (let i = 0; i < 80; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (2 + Math.random() * 2) + 's';
        el.style.animationDelay = Math.random() * 1.5 + 's';
        el.style.width = (6 + Math.random() * 8) + 'px';
        el.style.height = (12 + Math.random() * 16) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
    }
},

// ── Life Cards ──
goLife() {
    // 카테고리는 마지막 방문 상태 유지 (초기화 제거)
    document.getElementById('lifeSearch').value = '';
    this.renderLifeCatTabs();
    this.renderLifeCards();
    this.showScreen('scrLife');
},

renderLifeCatTabs() {
    document.getElementById('lifeCatTabs').innerHTML = LIFE_CATS.map(c =>
        `<button class="life-cat-tab${c.id === this.lifeCat ? ' on' : ''}" onclick="app.setLifeCat('${c.id}')">${c.label}</button>`
    ).join('');
},

setLifeCat(id) {
    this.lifeCat = id;
    document.getElementById('lifeSearch').value = '';
    this.renderLifeCatTabs();
    this.renderLifeCards();
},

filterLife() { this.renderLifeCards(); },

renderLifeCards() {
    const q = document.getElementById('lifeSearch').value.trim().toLowerCase();

    let items;
    if (q) {
        // 검색어 있으면 전체 카테고리에서 검색
        items = [];
        LIFE_CATS.forEach(cat => {
            LIFE_DATA[cat.id].forEach(c => {
                if (c.en.toLowerCase().includes(q) || c.pron.includes(q) ||
                    c.meaning.includes(q) || c.desc.includes(q)) {
                    items.push({...c, _cat: cat.label});
                }
            });
        });
    } else {
        // 검색어 없으면 현재 카테고리만
        items = LIFE_DATA[this.lifeCat];
    }

    document.getElementById('lifeCount').textContent =
        q ? `전체 검색 결과: ${items.length}개` : `${items.length}개`;
    document.getElementById('lifeTotalChip').textContent = items.length;

    if (!items.length) {
        document.getElementById('lifeList').innerHTML = '<div class="lci-no-result">🔍 검색 결과가 없습니다</div>';
        return;
    }
    document.getElementById('lifeList').innerHTML = items.map((c, i) => `
        <div class="life-card-item" id="lci-${i}" onclick="app.toggleLifeCard(${i})">
            <div class="lci-front">
                <div class="lci-en">${c.en}</div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0">
                    <span class="lci-pron">${c.pron}</span>
                    ${q && c._cat ? `<span style="font-size:11px;color:#bbb">${c._cat}</span>` : ''}
                </div>
                <button onclick="event.preventDefault();event.stopPropagation();app.speak('${c.en.replace(/'/g,"\\'")}')"
                    style="background:#3498db;border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-left:4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none">🔊</button>
                <div class="lci-arr">▼</div>
            </div>
            <div class="lci-back">
                <div class="lci-meaning">${c.meaning}</div>
                <div class="lci-desc">${c.desc}</div>
            </div>
        </div>`
    ).join('');
},

toggleLifeCard(i) {
    const el = document.getElementById('lci-' + i);
    if (el) el.classList.toggle('open');
},

// ── Life Quiz ──
startLifeQuiz() {
    const pool = LIFE_DATA[this.lifeCat];
    if (!pool || pool.length < 4) { alert('카드가 부족합니다.'); return; }

    // 최대 15문항, 섞어서 선택
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    const picked   = shuffled.slice(0, Math.min(15, shuffled.length));

    // 문제 생성 (영→한 / 한→영 혼합)
    this.quizList = picked.map(item => {
        const wrongPool = pool.filter(p => p.en !== item.en)
                              .sort(() => Math.random() - 0.5)
                              .slice(0, 3);
        const typeA = Math.random() > 0.5; // true = 영→한, false = 한→영

        if (typeA) {
            const opts = [item.meaning, ...wrongPool.map(p => p.meaning)]
                         .sort(() => Math.random() - 0.5);
            return { q:`다음 영어의 뜻은?\n"${item.en}"`, o:opts, a:opts.indexOf(item.meaning), e:'🔤' };
        } else {
            const opts = [item.en, ...wrongPool.map(p => p.en)]
                         .sort(() => Math.random() - 0.5);
            return { q:`다음 뜻의 영어 단어는?\n"${item.meaning}"`, o:opts, a:opts.indexOf(item.en), e:'🔤' };
        }
    });

    this.isLifeQuiz    = true;
    this.lifeQuizTotal = this.quizList.length;
    this.quizIdx       = 0;
    this.quizScore     = 0;
    this.wrongSet      = [];
    this.quizAnswered  = false;

    const catLabel = LIFE_CATS.find(ct => ct.id === this.lifeCat)?.label || '생활영어';
    document.getElementById('quizCount').textContent = `${catLabel} 퀴즈`;
    this.renderQuiz();
    this.showScreen('scrQuiz');
},


// ── Story Methods ──
openStoryList() {
    const grid = document.getElementById('storyGrid');
    grid.innerHTML = '';
    const done = BIBLE_STORIES.map((_,i) => !!this.progress['story'+i]);
    const doneCount = done.filter(Boolean).length;
    document.getElementById('storyDoneChip').textContent = doneCount+'/30';
    BIBLE_STORIES.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'story-card' + (done[i]?' done':'');
        card.innerHTML = `
            <div class="sc-icon">${s.icon}</div>
            <div class="sc-num">제 ${i+1}편</div>
            <div class="sc-title">${s.title}</div>
            <div class="sc-sub">${s.sents.length}문장</div>
            ${done[i]?'<span class="sc-done">✅</span>':''}
        `;
        card.onclick = () => this.openStory(i);
        grid.appendChild(card);
    });
    this.showScreen('scrStoryList');
},

openStory(idx) {
    this.curStoryIdx = idx;
    this.curStorySentIdx = 0;
    this.renderStorySent();
    this.showScreen('scrStoryRead');
},

backToStoryList() {
    this.openStoryList();
},

renderStorySent() {
    const story = BIBLE_STORIES[this.curStoryIdx];
    const sents = story.sents;
    const sent = sents[this.curStorySentIdx];
    const total = sents.length;
    const idx = this.curStorySentIdx;

    // Title bar
    document.getElementById('storyTitleBar').innerHTML = `
        <div class="stb-num">제 ${this.curStoryIdx+1}편</div>
        <div class="stb-title">${story.icon} ${story.title}</div>
        <div class="stb-sub">${story.titleEn}</div>
    `;

    // Progress
    document.getElementById('storyReadProg').textContent = (idx+1)+' / '+total;

    // Words
    const words = sent.en.split(' ');
    const prepWord = sent.prep || '';
    const arrowHtml = words.map(w => {
        const clean = w.replace(/[.,!?']/g,'').toLowerCase();
        const isPrep = prepWord && clean === prepWord.toLowerCase();
        const safew = w.replace(/'/g,"\\'");
        return `<span class="story-sent-word${isPrep?' prep-word':''}" ontouchend="app.showWord('${safew}',${isPrep})" onclick="app.showWord('${safew}',${isPrep})">
            <span class="ssw-en">${w}</span>
        </span>`;
    }).join('<span class="story-sent-sep">→</span>');

    document.getElementById('storyReadContent').innerHTML = `
        <div class="story-sent-card">
            <div class="story-sent-num">문장 ${idx+1} / ${total}</div>
            <div class="story-sent-arrow">${arrowHtml}</div>
            <button class="story-sent-meaning-btn" id="ssMeaningBtn" onclick="app.toggleStoryMeaning()">👁️ 뜻 보기</button>
            <div class="story-sent-kr" id="ssMeaning" style="display:none">${sent.kr}</div>
            <button class="story-sent-listen" ontouchend="app.tapSentence('${sent.en.replace(/'/g,"\\'")}')" onclick="app.tapSentence('${sent.en.replace(/'/g,"\\'")}')">🔊 문장 듣기</button>
        </div>
    `;

    document.getElementById('btnSSPrev').disabled = idx === 0;
    document.getElementById('btnSSNext').disabled = idx === total-1;

    // Show quiz button at last sentence
    const qwrap = document.getElementById('storyQuizBtnWrap');
    qwrap.style.display = (idx === total-1) ? 'block' : 'none';
},

toggleStoryMeaning() {
    const mean = document.getElementById('ssMeaning');
    const btn = document.getElementById('ssMeaningBtn');
    if (!mean || !btn) return;
    if (mean.style.display === 'none') {
        mean.style.display = 'block';
        btn.textContent = '🙈 뜻 숨기기';
        btn.classList.add('shown');
    } else {
        mean.style.display = 'none';
        btn.textContent = '👁️ 뜻 보기';
        btn.classList.remove('shown');
    }
},

prevStorySent() {
    if (this.curStorySentIdx > 0) {
        this.curStorySentIdx--;
        this.renderStorySent();
        window.scrollTo(0,0);
    }
},

nextStorySent() {
    const story = BIBLE_STORIES[this.curStoryIdx];
    if (this.curStorySentIdx < story.sents.length-1) {
        this.curStorySentIdx++;
        this.renderStorySent();
        window.scrollTo(0,0);
    }
},

startStoryQuiz() {
    const story = BIBLE_STORIES[this.curStoryIdx];
    this.quizList = story.quiz.map(q => {
        const opts = q.o.map((text,i) => ({text, isCorrect: i===q.a}));
        return { q: 'The preposition is missing:\n"'+story.sents.find(s=>s.prep===q.o[q.a])?.en.replace(q.o[q.a],'___')+'"\n\n'+q.q, o:q.o, a:q.a, e:q.e, _raw:q };
    });
    // Build proper quiz items for renderQuiz
    this.quizList = story.quiz.map(q => ({
        q: q.q, o: q.o, a: q.a, e: q.e
    }));
    this.isLifeQuiz = true;
    this.lifeQuizTotal = this.quizList.length;
    this.quizIdx = 0;
    this.quizScore = 0;
    this.wrongSet = [];
    this.quizAnswered = false;
    document.getElementById('quizCount').textContent = story.title+' 퀴즈';
    this.renderQuiz();
    this.showScreen('scrQuiz');
},

endQuiz() {
    if (this.isLifeQuiz) {
        this.isLifeQuiz = false;
        this.showScreen('scrLife');
    } else {
        this.showScreen('scrLearn');
    }
}
};

// Init
app.init();
</script>
</body>
</html>
